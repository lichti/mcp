<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mcp · web ui (protótipo)</title>
<style>
  :root {
    --bg: #080b0a;
    --bg-1: #0c1110;
    --panel: #111816;
    --panel-2: #151e1b;
    --line: #23312c;
    --line-soft: #1a2521;
    --txt: #e9f2ef;
    --txt-2: #a3b8b0;
    --txt-3: #6d8279;
    --accent: #3fd6a6;
    --accent-2: #2bb389;
    --accent-dim: rgba(63, 214, 166, .11);
    --warn: #e8b03e;
    --warn-dim: rgba(232, 176, 62, .12);
    --err: #f0716b;
    --err-dim: rgba(240, 113, 107, .12);
    --read: #6aa9ff;
    --read-dim: rgba(106, 169, 255, .12);
    --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
    --r: 10px;
    --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px -12px rgba(0,0,0,.8);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--txt);
    font: 13px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(63,214,166,.28); }
  a { color: inherit; text-decoration: none; }

  /* ---------- shell ---------- */
  .app { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
  .side {
    position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
    background: linear-gradient(180deg, #0b100f, #090d0c);
    border-right: 1px solid var(--line-soft); padding: 14px 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
  .logo {
    width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center;
    background: var(--accent); color: #04100c; font: 700 13px/1 var(--mono);
    box-shadow: 0 0 0 1px rgba(63,214,166,.35), 0 6px 18px -6px rgba(63,214,166,.6);
  }
  .brand-name { font-weight: 650; letter-spacing: -.01em; font-size: 14px; }
  .brand-sub { color: var(--txt-3); font-size: 11px; margin-top: -2px; }
  .nav { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
  .nav-label {
    color: var(--txt-3); font-size: 10.5px; text-transform: uppercase;
    letter-spacing: .09em; padding: 14px 10px 6px; font-weight: 600;
  }
  .nav a {
    display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 8px;
    color: var(--txt-2); font-weight: 500; transition: background .12s, color .12s;
  }
  .nav a:hover { background: rgba(255,255,255,.04); color: var(--txt); }
  .nav a.on { background: var(--accent-dim); color: var(--accent); }
  .nav a svg { width: 15px; height: 15px; opacity: .85; }
  .nav a.on svg { opacity: 1; }
  .nav .count {
    margin-left: auto; font: 500 10.5px/1 var(--mono); color: var(--txt-3);
    background: rgba(255,255,255,.05); border-radius: 20px; padding: 3px 6px;
  }
  .nav a.on .count { color: var(--accent); background: rgba(63,214,166,.14); }
  .side-foot { margin-top: auto; padding: 10px; border-top: 1px solid var(--line-soft); }
  .instance-chip {
    display: flex; align-items: center; gap: 8px; padding: 8px 9px; border-radius: 8px;
    border: 1px solid var(--line-soft); background: rgba(255,255,255,.02); font-size: 11.5px;
  }
  .instance-chip b { font-weight: 600; }
  .instance-chip code { font-family: var(--mono); color: var(--txt-2); font-size: 10.5px; }

  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
    padding: 12px 26px; border-bottom: 1px solid var(--line-soft);
    background: rgba(8,11,10,.82); backdrop-filter: blur(10px);
  }
  .topbar .crumb { color: var(--txt-3); font-size: 12px; }
  .topbar .crumb b { color: var(--txt); font-weight: 600; }
  .spacer { flex: 1; }
  .kbd {
    font: 500 10.5px/1 var(--mono); color: var(--txt-2); border: 1px solid var(--line);
    border-bottom-width: 2px; border-radius: 5px; padding: 3px 5px; background: var(--panel);
  }
  .searchbtn {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 10px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    color: var(--txt-3); cursor: pointer; font-size: 12px; min-width: 210px;
  }
  .searchbtn:hover { border-color: #2e403a; color: var(--txt-2); }
  .searchbtn .spacer { flex: 1; }
  .view { padding: 24px 26px 60px; max-width: 1240px; width: 100%; }

  /* ---------- primitives ---------- */
  h1 { font-size: 21px; letter-spacing: -.02em; margin: 0; font-weight: 650; }
  h2 { font-size: 14px; margin: 0; font-weight: 620; letter-spacing: -.01em; }
  h3 { font-size: 12px; margin: 0; font-weight: 620; color: var(--txt-2); }
  p.sub { color: var(--txt-3); margin: 5px 0 0; font-size: 12.5px; }
  .page-head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 20px; }
  .page-head .actions { margin-left: auto; display: flex; gap: 8px; }
  .btn {
    display: inline-flex; align-items: center; gap: 7px; padding: 7px 11px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel); color: var(--txt);
    font: 500 12px/1.2 var(--sans); cursor: pointer; transition: .12s;
  }
  .btn:hover { border-color: #35483f; background: var(--panel-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #04120d; font-weight: 640; }
  .btn.primary:hover { background: #4be3b3; }
  .btn.ghost { background: transparent; }
  .btn.danger { color: var(--err); border-color: rgba(240,113,107,.3); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.sm { padding: 5px 8px; font-size: 11.5px; }
  .card {
    background: linear-gradient(180deg, rgba(255,255,255,.018), transparent 60%), var(--panel);
    border: 1px solid var(--line-soft); border-radius: var(--r); box-shadow: var(--shadow);
  }
  .card-h {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    border-bottom: 1px solid var(--line-soft);
  }
  .card-h .spacer { flex: 1; }
  .card-b { padding: 14px; }
  .card-b.flush { padding: 0; }
  .grid { display: grid; gap: 14px; }
  .g2 { grid-template-columns: 1fr 1fr; }
  .g3 { grid-template-columns: repeat(3, 1fr); }
  .g4 { grid-template-columns: repeat(4, 1fr); }
  .row { display: flex; align-items: center; gap: 10px; }
  .muted { color: var(--txt-3); }
  .mono { font-family: var(--mono); }
  .tiny { font-size: 11px; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 2.5px 7px; border-radius: 6px;
    font: 500 10.5px/1.5 var(--mono); border: 1px solid var(--line); color: var(--txt-2);
    background: rgba(255,255,255,.025); white-space: nowrap;
  }
  .chip.ok { color: var(--accent); border-color: rgba(63,214,166,.28); background: var(--accent-dim); }
  .chip.warn { color: var(--warn); border-color: rgba(232,176,62,.28); background: var(--warn-dim); }
  .chip.err { color: var(--err); border-color: rgba(240,113,107,.28); background: var(--err-dim); }
  .chip.read { color: var(--read); border-color: rgba(106,169,255,.28); background: var(--read-dim); }
  .chip.n { color: var(--txt-3); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--txt-3); flex: none; }
  .dot.ok { background: var(--accent); box-shadow: 0 0 0 3px rgba(63,214,166,.13); }
  .dot.warn { background: var(--warn); box-shadow: 0 0 0 3px rgba(232,176,62,.13); }
  .dot.err { background: var(--err); box-shadow: 0 0 0 3px rgba(240,113,107,.13); }
  .dot.idle { background: #5b6f67; }
  .pulse { position: relative; }
  .pulse::after {
    content: ""; position: absolute; inset: -4px; border-radius: 50%;
    border: 1px solid currentColor; opacity: .5; animation: pulse 2s ease-out infinite;
  }
  @keyframes pulse { 0% { transform: scale(.6); opacity: .5 } 100% { transform: scale(1.5); opacity: 0 } }

  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; font: 600 10.5px/1 var(--sans); letter-spacing: .07em; text-transform: uppercase;
    color: var(--txt-3); padding: 9px 14px; border-bottom: 1px solid var(--line-soft);
  }
  td { padding: 9px 14px; border-bottom: 1px solid rgba(35,49,44,.5); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr.click { cursor: pointer; }
  tbody tr.click:hover { background: rgba(255,255,255,.022); }
  td.num, th.num { text-align: right; font-family: var(--mono); font-size: 11.5px; }

  .stat { padding: 14px 15px; }
  .stat .k { color: var(--txt-3); font-size: 11px; font-weight: 550; letter-spacing: .02em; }
  .stat .v { font: 620 26px/1.15 var(--sans); letter-spacing: -.03em; margin-top: 8px; display: flex; align-items: baseline; gap: 7px; }
  .stat .v small { font: 500 11.5px/1 var(--mono); color: var(--txt-3); letter-spacing: 0; }
  .stat .d { font-size: 11px; color: var(--txt-3); margin-top: 7px; display: flex; align-items: center; gap: 5px; }

  .banner {
    display: flex; gap: 12px; align-items: center; padding: 11px 14px; border-radius: var(--r);
    border: 1px solid rgba(232,176,62,.28); background: linear-gradient(90deg, var(--warn-dim), rgba(232,176,62,.03));
    margin-bottom: 16px;
  }
  .banner .t { font-weight: 600; font-size: 12.5px; }
  .banner .d { color: var(--txt-2); font-size: 12px; }
  .banner .actions { margin-left: auto; display: flex; gap: 8px; }

  .seg { display: inline-flex; padding: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .seg button {
    border: 0; background: transparent; color: var(--txt-3); padding: 5px 10px; border-radius: 6px;
    font: 550 11.5px/1.2 var(--sans); cursor: pointer;
  }
  .seg button.on { background: rgba(255,255,255,.07); color: var(--txt); }

  .field { margin-bottom: 13px; }
  .field label { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 570; color: var(--txt-2); margin-bottom: 6px; }
  .field .req { color: var(--accent); font-size: 10px; }
  .input, select, textarea {
    width: 100%; background: #0b1110; border: 1px solid var(--line); color: var(--txt);
    border-radius: 7px; padding: 8px 10px; font: 12px/1.45 var(--mono); outline: none;
    transition: border-color .12s, box-shadow .12s;
  }
  .input:focus, select:focus, textarea:focus { border-color: var(--accent-2); box-shadow: 0 0 0 3px rgba(63,214,166,.12); }
  .hint { color: var(--txt-3); font-size: 11px; margin-top: 5px; font-family: var(--sans); }

  pre.code {
    margin: 0; padding: 12px 14px; background: #080d0b; border-radius: 8px;
    border: 1px solid var(--line-soft); overflow: auto; font: 11.5px/1.65 var(--mono); color: #c8dbd3;
  }
  .k-str { color: #8fd6b4; } .k-key { color: #86b8ff; } .k-num { color: #e8b03e; }
  .k-bool { color: #c99df5; } .k-null { color: #6d8279; } .k-redact { color: #4d5f58; background: #16201d; border-radius: 3px; padding: 0 3px; }
  .k-com { color: #4d6159; }

  .split { display: grid; grid-template-columns: minmax(0,1fr) 380px; gap: 14px; align-items: start; }
  .split > *, .grid > * { min-width: 0; }
  .pg { grid-template-columns: 240px minmax(0,1fr) 424px; }
  @media (max-width: 1380px) {
    .pg { grid-template-columns: 240px minmax(0,1fr); }
    .pg > :nth-child(3) { grid-column: 1 / -1; }
  }
  .stack { display: flex; flex-direction: column; gap: 14px; }

  /* list detail */
  .detail-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
  .avatar {
    width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex: none;
    background: var(--panel-2); border: 1px solid var(--line); font: 600 13px/1 var(--mono); color: var(--accent);
  }
  .avatar.sm { width: 24px; height: 24px; border-radius: 6px; font-size: 10px; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line-soft); margin-bottom: 16px; }
  .tabs button {
    border: 0; background: transparent; color: var(--txt-3); padding: 9px 12px; cursor: pointer;
    font: 550 12px/1.2 var(--sans); border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tabs button:hover { color: var(--txt-2); }
  .tabs button.on { color: var(--txt); border-bottom-color: var(--accent); }

  .kv { display: grid; grid-template-columns: 116px 1fr; gap: 8px 12px; font-size: 12px; }
  .kv dt { color: var(--txt-3); }
  .kv dd { margin: 0; }

  /* playground */
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tlist { max-height: 620px; overflow: auto; }
  .titem {
    display: flex; align-items: center; gap: 9px; padding: 8px 12px; cursor: pointer;
    border-bottom: 1px solid rgba(35,49,44,.4);
  }
  .titem:hover { background: rgba(255,255,255,.022); }
  .titem.on { background: var(--accent-dim); box-shadow: inset 2px 0 0 var(--accent); }
  .titem .n { font: 500 11.5px/1.4 var(--mono); }
  .titem .g { margin-left: auto; }

  /* activity */
  .act-row { cursor: pointer; }
  .act-row:hover { background: rgba(255,255,255,.022); }
  .act-detail td { background: #0a100e; padding: 0; }
  .act-detail .inner { padding: 14px 16px; display: grid; grid-template-columns: 1fr 300px; gap: 16px; }
  .live { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font: 600 10.5px/1 var(--mono); letter-spacing: .08em; }

  /* acl matrix */
  .matrix { width: 100%; border-collapse: separate; border-spacing: 0; }
  .matrix th, .matrix td { border-bottom: 1px solid var(--line-soft); padding: 8px 10px; font-size: 11.5px; }
  .matrix th { font: 600 10px/1 var(--sans); letter-spacing: .07em; text-transform: uppercase; color: var(--txt-3); }
  .matrix .cell { text-align: center; font-family: var(--mono); }
  .allow { color: var(--accent); } .deny { color: var(--err); } .maybe { color: var(--warn); }

  .verdict { border-radius: var(--r); border: 1px solid; padding: 16px; }
  .verdict.allow { border-color: rgba(63,214,166,.3); background: linear-gradient(135deg, var(--accent-dim), transparent); }
  .verdict.deny { border-color: rgba(240,113,107,.3); background: linear-gradient(135deg, var(--err-dim), transparent); }
  .verdict .label { font: 700 11px/1 var(--mono); letter-spacing: .1em; }

  .empty { text-align: center; padding: 40px 20px; color: var(--txt-3); }

  /* palette */
  .palette-wrap {
    position: fixed; inset: 0; background: rgba(4,7,6,.62); backdrop-filter: blur(6px);
    display: none; place-items: start center; padding-top: 12vh; z-index: 100;
  }
  .palette-wrap.open { display: grid; }
  .palette {
    width: 560px; max-width: 92vw; background: #0d1211; border: 1px solid #2b3b35; border-radius: 12px;
    box-shadow: 0 40px 80px -20px rgba(0,0,0,.9); overflow: hidden;
  }
  .palette input {
    width: 100%; border: 0; background: transparent; color: var(--txt); padding: 15px 16px;
    font: 14px/1.2 var(--sans); outline: none; border-bottom: 1px solid var(--line-soft);
  }
  .palette .res { max-height: 340px; overflow: auto; padding: 6px; }
  .palette .ritem { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; cursor: pointer; }
  .palette .ritem.on, .palette .ritem:hover { background: rgba(255,255,255,.05); }
  .palette .ritem .k { margin-left: auto; color: var(--txt-3); font-size: 10.5px; font-family: var(--mono); }
  .palette .foot { padding: 8px 12px; border-top: 1px solid var(--line-soft); color: var(--txt-3); font-size: 10.5px; display: flex; gap: 12px; }

  .tip { position: relative; }
  .tip[data-tip]:hover::after {
    content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    background: #1b2622; color: var(--txt-2); border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 8px; font: 500 10.5px/1.3 var(--sans); white-space: nowrap; z-index: 50;
  }
  .scroll-x { overflow-x: auto; }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand" title="Protótipo estático — dados fictícios, sem backend">
      <div class="logo">m</div>
      <div>
        <div class="brand-name">mcp</div>
        <div class="brand-sub">control room</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-label">Operate</div>
      <a href="#/overview" data-route="overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-3H4zM14 7h6V4h-6z"/></svg>
        Overview
      </a>
      <a href="#/servers" data-route="servers">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><path d="M7 7h.01M7 17h.01"/></svg>
        Servers <span class="count">9</span>
      </a>
      <a href="#/playground" data-route="playground">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 6l-5 6 5 6M16 6l5 6-5 6"/></svg>
        Playground
      </a>
      <a href="#/activity" data-route="activity">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>
        Activity <span class="count" id="act-count">1.8k</span>
      </a>
      <div class="nav-label">Govern</div>
      <a href="#/access" data-route="access">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M9 12l2 2 4-4"/></svg>
        Access
      </a>
      <a href="#/settings" data-route="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-2.9 1.2V21a2 2 0 11-4 0v-.1A1.7 1.7 0 007 19.4l-.1.1a2 2 0 11-2.8-2.8l.1-.1A1.7 1.7 0 003 15H3a2 2 0 110-4h.1A1.7 1.7 0 004.6 9l-.1-.1a2 2 0 112.8-2.8l.1.1A1.7 1.7 0 009 4.6V4a2 2 0 114 0v.1A1.7 1.7 0 0015 4.6l.1-.1a2 2 0 112.8 2.8l-.1.1A1.7 1.7 0 0021 9v.1a2 2 0 110 3.9h-.1"/></svg>
        Settings
      </a>
    </nav>
    <div class="side-foot">
      <div class="instance-chip">
        <span class="dot ok pulse" style="color:var(--accent)"></span>
        <div style="min-width:0">
          <div><b>serve</b> <code>127.0.0.1:7332</code></div>
          <div class="tiny muted" style="font-size:10px">v0.6.2 · uptime 4h12m</div>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="crumb">mcp / <b id="crumb">Overview</b></div>
      <div class="spacer"></div>
      <div class="searchbtn" id="openPalette">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        Search servers, tools, runs
        <span class="spacer"></span>
        <span class="kbd">⌘K</span>
      </div>
      <div class="chip ok" title="modo local: escrita habilitada">local · admin</div>
      <div class="avatar sm" style="background:var(--accent);color:#04120d;border:0">al</div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>

<div class="palette-wrap" id="paletteWrap">
  <div class="palette">
    <input id="paletteInput" placeholder="Jump to server, tool or page…" autocomplete="off">
    <div class="res" id="paletteRes"></div>
    <div class="foot"><span><span class="kbd">↑↓</span> navegar</span><span><span class="kbd">↵</span> abrir</span><span><span class="kbd">esc</span> fechar</span></div>
  </div>
</div>

<script>
/* ------------------------------------------------------------------ data */
const servers = [

/* ------------------------------------------------------------------ utils */
const $ = (sel, el) => (el || document).querySelector(sel);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const stateChip = s => ({
  connected: '<span class="chip ok"><span class="dot ok"></span>connected</span>',
  idle: '<span class="chip n"><span class="dot idle"></span>idle</span>',
  cached: '<span class="chip n">cached</span>',
  error: '<span class="chip err"><span class="dot err"></span>401</span>',
}[s] || s);
const typeChip = t => `<span class="chip">${t}</span>`;

function json(s) {
  return esc(s)
    .replace(/(&quot;(?:[^&]|&(?!quot;))*?&quot;)(\s*:)/g, '<span class="k-key">$1</span>$2')
    .replace(/:(\s*)(&quot;(?:[^&]|&(?!quot;))*?&quot;)/g, ':$1<span class="k-str">$2</span>')
    .replace(/:(\s*)(-?\d+(?:\.\d+)?)/g, ':$1<span class="k-num">$2</span>')
    .replace(/:(\s*)(true|false)/g, ':$1<span class="k-bool">$2</span>')
    .replace(/:(\s*)(null)/g, ':$1<span class="k-null">$2</span>');
}

function sparkline(data, w, h, color) {
  const max = Math.max(...data), min = Math.min(...data);
  const pts = data.map((v, i) => [i / (data.length - 1) * w, h - ((v - min) / (max - min || 1)) * (h - 4) - 2]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = d + ` L${w} ${h} L0 ${h} Z`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="g${color.replace(/[^a-z0-9]/gi,'')}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#g${color.replace(/[^a-z0-9]/gi,'')})"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
}

/* ------------------------------------------------------------------ router */
const titles = { overview:'Overview', servers:'Servers', edit:'Editar servidor', playground:'Playground', activity:'Activity', access:'Access', settings:'Settings' };
function route() {
  const [_, name = 'overview', param] = (location.hash || '#/overview').split('/');
  const fn = views[name] || views.overview;
  $('#view').innerHTML = fn(param);
  $('#crumb').textContent = titles[name] || 'Overview';
  document.querySelectorAll('[data-route]').forEach(a => a.classList.toggle('on', a.dataset.route === name || (name === 'edit' && a.dataset.route === 'servers')));
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();

/* ------------------------------------------------------------------ palette */
const items = [
  ...['overview','servers','playground','activity','access','settings'].map(r => ({ label: titles[r], hint: 'página', go: '#/' + r })),
  ...servers.map(s => ({ label: s.name, hint: 'servidor', go: '#/servers/' + s.name })),
  ...tools.map(t => ({ label: t.s + '__' + t.n, hint: 'tool', go: '#/playground' })),
];
let sel = 0;
function renderPalette(q) {
  const list = items.filter(i => i.label.toLowerCase().includes(q.toLowerCase())).slice(0, 9);
  sel = 0;
  $('#paletteRes').innerHTML = list.map((i, n) => `<div class="ritem ${n === 0 ? 'on' : ''}" onclick="location.hash='${i.go}';closePalette()">
      <span class="mono tiny">${esc(i.label)}</span><span class="k">${i.hint}</span></div>`).join('') || '<div class="empty">nada encontrado</div>';
}
function openPalette() { $('#paletteWrap').classList.add('open'); $('#paletteInput').value = ''; renderPalette(''); $('#paletteInput').focus(); }
function closePalette() { $('#paletteWrap').classList.remove('open'); }
$('#openPalette').onclick = openPalette;
$('#paletteInput').oninput = e => renderPalette(e.target.value);
$('#paletteWrap').onclick = e => { if (e.target.id === 'paletteWrap') closePalette(); };
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); }
  if (e.key === 'Escape') closePalette();
  if (e.key === 'Enter' && $('#paletteWrap').classList.contains('open')) {
    const on = $('#paletteRes .ritem.on'); if (on) on.click();
  }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (!$('#paletteWrap').classList.contains('open')) return;
    e.preventDefault();
    const rs = [...document.querySelectorAll('#paletteRes .ritem')];
    if (!rs.length) return;
    sel = (sel + (e.key === 'ArrowDown' ? 1 : rs.length - 1)) % rs.length;
    rs.forEach((r, i) => r.classList.toggle('on', i === sel));
  }
});
</script>
</body>
</html>
